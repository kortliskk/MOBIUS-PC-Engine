name: Build MOBIUS PC Engine APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build-mobius-engine.yml"
      - "limbo-android-lib/**"
      - "limbo-android-x86/**"
      - "settings.gradle"
      - "build.gradle"

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64-hosted x86 QEMU APK
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake binutils bison build-essential ca-certificates \
            curl flex gettext git gtk-doc-tools libtool libtool-bin make patch pkg-config \
            python3 rsync texinfo unzip wget xz-utils

      # Android SDK setup needs Java 17+; v4 also avoids the removed "tools" package.
      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-29" "build-tools;29.0.3"

      # This legacy project uses Gradle 6.7.1, which should run on Java 11.
      - name: Set up Java 11 for legacy Gradle build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install Gradle 6.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-6.7.1-bin.zip \
            -o "$RUNNER_TEMP/gradle-6.7.1-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-6.7.1-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-6.7.1/bin" >> "$GITHUB_PATH"

      - name: Install Android NDK r23b
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r23b-linux.zip \
            -o "$RUNNER_TEMP/android-ndk-r23b-linux.zip"
          unzip -q "$RUNNER_TEMP/android-ndk-r23b-linux.zip" -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r23b" >> "$GITHUB_ENV"

      - name: Download QEMU and native dependencies
        working-directory: limbo-android-lib/src/main/jni
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 https://download.qemu.org/qemu-5.1.0.tar.xz -o "$RUNNER_TEMP/qemu.tar.xz"
          tar -xJf "$RUNNER_TEMP/qemu.tar.xz"
          mv qemu-5.1.0 qemu

          curl -fL --retry 3 https://ftp.gnome.org/pub/GNOME/sources/glib/2.56/glib-2.56.1.tar.xz -o "$RUNNER_TEMP/glib.tar.xz"
          tar -xJf "$RUNNER_TEMP/glib.tar.xz"
          mv glib-2.56.1 glib

          curl -fL --retry 3 https://sourceware.org/pub/libffi/libffi-3.3.tar.gz -o "$RUNNER_TEMP/libffi.tar.gz"
          tar -xzf "$RUNNER_TEMP/libffi.tar.gz"
          mv libffi-3.3 libffi

          curl -fL --retry 3 https://www.cairographics.org/releases/pixman-0.40.0.tar.gz -o "$RUNNER_TEMP/pixman.tar.gz"
          tar -xzf "$RUNNER_TEMP/pixman.tar.gz"
          mv pixman-0.40.0 pixman

          curl -fL --retry 3 https://www.libsdl.org/release/SDL2-2.0.8.tar.gz -o "$RUNNER_TEMP/sdl2.tar.gz"
          tar -xzf "$RUNNER_TEMP/sdl2.tar.gz"
          mv SDL2-2.0.8 SDL2

      - name: Apply Limbo Android compatibility patches
        working-directory: limbo-android-lib/src/main/jni
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --forward -d qemu -p1 < patches/qemu-5.1.0.patch
          patch --batch --forward -d glib -p1 < patches/glib-2.56.1.patch
          patch --batch --forward -d SDL2 -p1 < patches/sdl2-2.0.8.patch

      - name: Compile QEMU native engine for Android ARM64
        working-directory: limbo-android-lib/src/main/jni
        shell: bash
        env:
          BUILD_HOST: arm64-v8a
          BUILD_GUEST: x86_64-softmmu
          USE_QEMU_VERSION: "5.1.0"
          USE_SDL: "true"
          USE_SDL_AUDIO: "true"
          USE_AAUDIO: "false"
          USE_KVM: "false"
          BUILD_THREADS: "4"
          NDK_ENV: linux-x86_64
        run: |
          set -euo pipefail
          export NDK_ROOT="$ANDROID_NDK_HOME"
          make limbo

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :limbo-android-x86:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOBIUS-PC-Engine-debug-apk
          path: limbo-android-x86/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
